[package]
name = "baidupan-lite"
version = "0.4.0"
description = "轻量版百度网盘客户端"
authors = ["zhounan36@163.com"]
edition = "2021"

[lib]
name = "baidupan_lite_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "baidupan-lite"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "gzip", "native-tls", "multipart", "cookies"] }
tokio = { version = "1", features = ["fs", "io-util", "macros", "rt", "time"] }
md-5 = "0.10"
futures-util = "0.3"
base64 = "0.22"
zip = { version = "2", default-features = false }
tiny_http = "0.12"

# 最小化产物体积
[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
